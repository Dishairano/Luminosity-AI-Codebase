# Luminosity OS - Hyprland-config (OS2) — draait als gebruiker lumo in de live-ISO.
# De live-ISO boot in de grafische installer (kiosk). "Probeer" de schil kan via
# een sneltoets, en een terminal via SUPER+RETURN.

# Start de grafische installer zodra Hyprland klaar is.
exec-once = /opt/luminosity-installer/launch-installer.sh

# Basis-uiterlijk
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

# Sneltoetsen: terminal, "probeer de schil", en afsluiten.
$mod = SUPER
bind = $mod, RETURN, exec, foot
bind = $mod, L, exec, /usr/local/bin/luminosity-shell
bind = $mod SHIFT, Q, exit
