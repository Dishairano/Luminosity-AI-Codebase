# Luminosity OS - Hyprland-config (OS2) — draait als gebruiker lumo in de live-ISO.
# De live-ISO boot in de grafische installer (kiosk). "Probeer" de schil kan via
# een sneltoets, en een terminal via SUPER+RETURN.

# Gebruik de hoogst beschikbare resolutie van het scherm (geeft de installer
# meer ruimte; helpt op VM's met een lage standaardresolutie).
monitor = , highres, auto, 1

# Start de grafische installer zodra Hyprland klaar is.
exec-once = /opt/luminosity-installer/launch-installer.sh

# Basis-uiterlijk
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

# Geen Hyprland-standaardwallpaper/logo tonen vóór de installer; gewoon onze
# donkere achtergrond (zelfde kleur als de splash/installer = naadloos).
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0a0c12)
}

# Sneltoetsen: terminal, "probeer de schil", en afsluiten.
$mod = SUPER
bind = $mod, RETURN, exec, foot
bind = $mod, L, exec, /usr/local/bin/luminosity-shell
bind = $mod SHIFT, Q, exit
