# Luminosity OS - Hyprland-config (OS2)
# Start bij het opstarten meteen de Luminosity-schil (Quickshell), fullscreen.
# Geen standaard bureaublad: de gebruiker ziet alleen Luminosity.

# Start de schil zodra Hyprland klaar is (met eerlijke terugval als quickshell ontbreekt).
exec-once = /usr/local/bin/luminosity-shell

# Basis-uiterlijk
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

# Noodtoetsen (voor ontwikkeling/nood): terminal en afsluiten.
$mod = SUPER
bind = $mod, RETURN, exec, foot
bind = $mod SHIFT, Q, exit
