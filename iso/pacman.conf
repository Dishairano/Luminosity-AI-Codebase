[options]
HoldPkg = pacman glibc
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Lokale repo met zelfgebouwde AUR-pakketten (quickshell). build.sh vult deze.
[luminosity-local]
SigLevel = Optional TrustAll
Server = file:///tmp/luminosity-repo

[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
