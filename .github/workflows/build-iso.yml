name: Build Luminosity ISO

# Bouwt de bootbare ISO (OS4) in een Arch Linux-container op een GitHub-runner.
# mkarchiso heeft loop-devices/mount nodig, dus de job draait --privileged.
#
# - push/PR: bouwt de ISO en bewaart hem als build-artifact.
# - tag v*:  bouwt de ISO en hangt hem aan een GitHub Release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_quickshell:
        description: "quickshell uit de AUR meebouwen (langzamer)"
        type: boolean
        default: false

permissions:
  contents: write   # nodig om de ISO aan een GitHub Release te hangen

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installeer build-afhankelijkheden (archiso)
        run: pacman -Sy --noconfirm --needed archiso git base-devel sudo

      - name: Bouw de ISO
        run: |
          cd iso
          if [ "${{ github.event.inputs.with_quickshell }}" = "true" ]; then
            ./build.sh --with-quickshell
          else
            ./build.sh
          fi

      - name: Toon resultaat
        run: ls -lh iso/out/

      - name: Upload ISO als artifact
        uses: actions/upload-artifact@v4
        with:
          name: luminosity-iso
          path: iso/out/*.iso
          if-no-files-found: error

      - name: Upload build-log als artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: iso/out/build.log
          if-no-files-found: ignore

  # Boot de gebouwde ISO headless in QEMU en bevestig dat de live-omgeving +
  # installer-backend opkomen (de service schrijft een markering naar de seriële
  # poort). Geen GPU nodig: de server draait via systemd, losgekoppeld van de schil.
  boot-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download de gebouwde ISO
        uses: actions/download-artifact@v4
        with:
          name: luminosity-iso
          path: iso-out

      - name: Installeer QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: KVM toegankelijk maken (GitHub-runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Headless boot-smoketest
        run: |
          ISO="$(ls iso-out/*.iso | head -1)"
          echo "Boot $ISO in QEMU (headless)…"

          boot() {  # $1 = accel; start QEMU, wacht op de markering
            local accel="$1"
            echo "→ poging met versnelling: $accel"
            : > serial.log
            qemu-system-x86_64 \
              -machine accel=$accel -cpu max -m 3072 -smp 2 \
              -cdrom "$ISO" -boot d -no-reboot \
              -display none -serial file:serial.log &
            local qpid=$! n="$2"
            for _ in $(seq 1 "$n"); do
              grep -q "LUMINOSITY_INSTALLER_UP" serial.log 2>/dev/null && { kill $qpid 2>/dev/null; return 0; }
              kill -0 $qpid 2>/dev/null || { echo "  QEMU stopte (accel=$accel)."; return 2; }
              sleep 5
            done
            kill $qpid 2>/dev/null
            return 1
          }

          ok=0
          # Probeer eerst KVM (snel). Faalt dat meteen (permissie), val terug op TCG.
          if [ -w /dev/kvm ]; then
            boot kvm 120 && ok=1
          fi
          if [ "$ok" != "1" ]; then
            boot tcg 180 && ok=1     # software-emulatie: traag maar altijd beschikbaar
          fi

          echo "----- laatste seriële output -----"
          tail -n 60 serial.log 2>/dev/null || echo "(geen seriële output)"
          if [ "$ok" = "1" ]; then
            echo "✓ Live-ISO geboot en installer-service is opgekomen."
          else
            echo "✗ Boot-markering niet gezien."; exit 1
          fi

      - name: Bewaar de seriële log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-serial-log
          path: serial.log
          if-no-files-found: ignore

  # Hangt de ISO aan een GitHub Release — alleen bij een tag, en alleen als de
  # boot-test slaagde. Draait op de host (niet in een container), zodat
  # GITHUB_TOKEN-auth betrouwbaar werkt (de container-variant gaf een 401).
  release:
    needs: [build, boot-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download de gebouwde ISO
        uses: actions/download-artifact@v4
        with:
          name: luminosity-iso
          path: iso-out

      - name: Publiceer de release
        uses: softprops/action-gh-release@v2
        with:
          files: iso-out/*.iso
          fail_on_unmatched_files: true
